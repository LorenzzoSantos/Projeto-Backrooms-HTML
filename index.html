<!DOCTYPE html>
<html lang="pt-br">
<head>
<link rel="stylesheet" href="css/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>Clica aqui pra login pai</h2>

<button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Login</button>

<div id="id01" class="modal">
  
  <form class="modal-content animate">
    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
      <img src="css/caran.jpg" alt="Avatar" width= "100", height= "300", class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>Nome de Usuário</b></label>
      <input type="text" placeholder="Bota o nome aí cara" name="uname" id="nome">

      <label for="psw"><b>Senha</b></label>
      <input type="password" placeholder="Bota tua senha lixo" name="psw" id="senha">
        
      <button type="submit" onclick="login()">Login</button>
      <label>
        <input type="checkbox" checked="checked" name="remember"> Lembrar
      </label>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw"><a href="#">Esqueceu a senha lixão?</a></span>
    </div>
  </form>
</div>
<script src="js/script.js"></script>
</body>
</html>
